x-provenance:
  added: '2026-08-23'
  method: searched
  source: https://scopewise.youworkagent.online/apis.json
  note: >-
    Submitted via apis.io/add on 2026-08-23 from hello@youworkagent.online and rated 71 (exemplar)
    by the gate. Like Southend earlier the same day, the submitted APIs.json URL is CORRECT — it
    returns JSON, an invented control path returns a real 404, and every declared property was
    fetched and confirmed before being written here.
    SLUGGED FROM THE COMPANY, NOT THE PRODUCT. The submission names "Scopewise Project Quote API"
    and is served from the subdomain scopewise.youworkagent.online, but the provider is YouWork
    Agent on youworkagent.online, and the provider's OWN apis.json already models it that way:
    its aid is "youworkagent.online:scopewise", kind company, maintainer YouWork Agent. So this
    record is the company and Scopewise is two APIs inside it. That is also what a domain-derived
    slug would produce — see roadmap#93.
    The agent surface is real and was verified rather than taken on trust: an A2A agent card, an
    agent-skills index, a machine-readable api-onboarding document, and an RFC 9727 api-catalog
    served as application/linkset+json carrying profile="https://www.rfc-editor.org/info/rfc9727" —
    the most precise media type seen in this sweep. The API is live and unauthenticated: an empty
    POST to /api/v1/project-quote returns 400 JSON, which is correct validation rather than a stub.
    Both declared APIs share ONE OpenAPI document of two paths. They are recorded as two apis[]
    entries because the provider declares them separately, but the contract behind them is the same
    file.
