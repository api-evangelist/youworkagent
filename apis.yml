aid: youworkagent
name: YouWork Agent
description: >-
  YouWork Agent publishes Scopewise, a deterministic commercial API for Indian freelancers and
  agencies: a project-quote endpoint that prices a scope of work in INR, and an overdue-invoice
  follow-up endpoint. The contract is an OpenAPI 3.1 document of two operations and four schemas
  served from scopewise.youworkagent.online. The provider is unusually agent-native for its size —
  alongside the specification it serves an A2A agent card, a declared agent-skills index, an RFC
  9727 api-catalog (as application/linkset+json carrying the RFC profile parameter), a machine-
  readable API onboarding document, and an llms.txt.
